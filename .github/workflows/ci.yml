name: CI

on:
  # Branch pushes are tested by their PR; pushing to feature branches here would take the macOS runners
  # that stress.yml needs (5 at a time).
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Rust + Swift build and test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          rustup --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Build Rust core (xcframework + UniFFI bindings)
        run: ./scripts/build-rust.sh

      - name: UniFFI bindings are committed
        run: git diff --exit-code -- Sources/OlazCore/OlazCore.swift

      - name: Swift build
        run: swift build

      # Wall-clock budget tests need a quiet host: gate-core.sh runs them alone in check 7. A shared runner
      # only adds noise, so CI skips the same list (user-decisions item 20.4).
      - name: Swift tests
        run: |
          timing=$(sed -n "s/^TIMING_SWIFT='\(.*\)'$/\1/p" scripts/gate-core.sh)
          test -n "$timing"
          swift test --skip "$timing"
