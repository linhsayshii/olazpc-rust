name: Release

# Push a tag to publish a release:  git tag v1.2.0 && git push origin v1.2.0
# Or run it from the Actions tab with a version (the tag v<version> is created on the chosen commit).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      OLAZ_UNIVERSAL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "OLAZ_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OLAZ_BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          # notarized: Developer ID cert + App Store Connect API key. fixed: a cert only (the self-signed
          # "Olaz Release Signing" one), stable signature but not notarized. adhoc: no secrets.
          if [[ -n "$MACOS_CERT_P12_BASE64" && -n "$APPLE_API_KEY_P8_BASE64" ]]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"
          elif [[ -n "$MACOS_CERT_P12_BASE64" ]]; then
            echo "mode=fixed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not set: publishing an ad-hoc signed, non-notarized build."
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Import signing certificate
        if: steps.version.outputs.mode != 'adhoc'
        run: |
          KC="$RUNNER_TEMP/olaz-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          EXISTING=()
          while IFS= read -r line; do
            [[ -n "$line" ]] && EXISTING+=("$line")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KC" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Sign by SHA-1 so the name cannot be ambiguous; a self-signed cert is listed as untrusted, which codesign accepts.
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/^ *1\)/ {print $2; exit}')"
          [[ -n "$IDENTITY" ]] || { echo "no code-signing identity in the imported certificate" >&2; exit 1; }
          echo "OLAZ_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "OLAZ_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Import notary key
        if: steps.version.outputs.mode == 'notarized'
        run: |
          KC="$OLAZ_SIGN_KEYCHAIN"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials olaz-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$KC"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "OLAZ_NOTARY_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build, sign, notarize (Developer ID)
        if: steps.version.outputs.mode == 'notarized'
        run: ./scripts/release.sh

      - name: Build and package (fixed or ad-hoc signature, not notarized)
        if: steps.version.outputs.mode != 'notarized'
        run: ./scripts/package.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 -- *.dmg *.zip | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.version.outputs.mode }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Olaz $VERSION for macOS 26 Tahoe or later (universal: Apple Silicon + Intel)."
            echo
            if [[ "$MODE" == "notarized" ]]; then
              echo "Signed with Developer ID and notarized by Apple."
            else
              echo "> [!WARNING]"
              if [[ "$MODE" == "fixed" ]]; then
                echo "> Signed with Olaz's own fixed certificate (Keychain and permissions are kept across updates) but **not notarized** by Apple."
              else
                echo "> This build is **not notarized** (ad-hoc signed)."
              fi
              echo "> After copying Olaz.app to /Applications, run once:"
              echo '> `xattr -dr com.apple.quarantine /Applications/Olaz.app`'
              echo "> or open it once, then allow it in System Settings > Privacy & Security > Open Anyway."
            fi
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
          } > "$NOTES"
          PRERELEASE=()
          [[ "$VERSION" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "Olaz $VERSION" --notes-file "$NOTES" --generate-notes \
            --target "$GITHUB_SHA" "${PRERELEASE[@]}"

      - name: Remove signing keychain
        if: always() && steps.version.outputs.mode != 'adhoc'
        run: security delete-keychain "$RUNNER_TEMP/olaz-signing.keychain-db" || true
