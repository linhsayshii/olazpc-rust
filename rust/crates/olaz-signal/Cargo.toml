[package]
name = "olaz-signal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Upstream, pinned to a tag. The workspace `[patch]` swaps `libsignal-protocol` for the
# vendored, Zalo-patched copy (rust/vendor/libsignal-protocol, ADR-015).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.73.0" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.73.0" }

async-trait = "0.1.89"
base64 = "0.23.1"
prost = "0.13.1"
rand = "0.9"
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
futures-executor = "0.3"
