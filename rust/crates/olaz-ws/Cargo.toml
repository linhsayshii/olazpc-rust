[package]
name = "olaz-ws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
olaz-json = { path = "../olaz-json" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
tracing = { version = "0.1", optional = true }
olaz-crypto = { path = "../olaz-crypto", optional = true }

[features]
default = ["transport"]
# Live WebSocket transport (tokio + tokio-tungstenite). Off => pure core only.
transport = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-native-certs", "dep:tracing", "dep:olaz-crypto"]

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "test-util"] }
