[package]
name = "olaz-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.1"
base64 = "0.23.1"
olaz-json = { path = "../olaz-json" }
cbc = { version = "0.2.1", features = ["alloc"] }
flate2 = "1.1.11"
hex = "0.4.3"
md-5 = "0.11.0"
rand = "0.10.4"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
