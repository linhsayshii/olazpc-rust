[package]
name = "olaz-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
olaz-client = { path = "../olaz-client" }
async-trait = "0.1"
olaz-api = { path = "../olaz-api" }
olaz-core = { path = "../olaz-core" }
olaz-crypto = { path = "../olaz-crypto" }
olaz-json = { path = "../olaz-json" }
olaz-media = { path = "../olaz-media" }
olaz-net = { path = "../olaz-net" }
olaz-signal = { path = "../olaz-signal" }
olaz-store = { path = "../olaz-store" }
olaz-wire = { path = "../olaz-wire" }
olaz-ws = { path = "../olaz-ws" }
rand = "0.9"
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
uniffi = "0.32.2"

[dev-dependencies]
tokio-tungstenite = "0.30"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "time"] }
